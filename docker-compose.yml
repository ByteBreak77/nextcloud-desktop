# Local testing / building ONLY. Production deployments use deploy/portainer-stack.yml.
services:
  nextcloud-desktop:
    build:
      context: .
    image: nextcloud-desktop:local
    container_name: nextcloud-desktop
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3100}:3001"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - ./Config:/config
      - ./Data:/client-data
    shm_size: "1gb"
