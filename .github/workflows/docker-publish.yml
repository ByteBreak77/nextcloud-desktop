name: Build and publish Docker image

on:
  push:
    branches:
      - main

  schedule:
    # Jeden 1. des Monats um 03:00 UTC
    - cron: "0 3 1 * *"


  # Zusätzlich manuell unter GitHub -> Actions startbar
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 1. ERGÄNZUNG: QEMU wird benötigt, um ARM64 auf Intel-Servern zu emulieren
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nextcloud-desktop
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          # Aktuelle Basis herunterladen
          pull: true

          # apt update / Paketinstallation wirklich neu ausführen
          no-cache: true

          # 2. ERGÄNZUNG: Hier werden die Ziel-Architekturen definiert
          platforms: linux/amd64,linux/arm64

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
